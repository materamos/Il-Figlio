name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code, tests and fixture build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Lint
        run: npm run lint

      - name: Run unit and guard tests
        run: npm test

      - name: Build with the explicit CI fixture
        env:
          ALLOW_FIXTURE_BUILD: "true"
          MENU_DATA_SOURCE: fixture
          PUBLIC_SITE_URL: https://il-figlio.example.test
        run: npm run build

      - name: Verify that the artifact contains no private values
        run: npm run verify:dist-secrets
